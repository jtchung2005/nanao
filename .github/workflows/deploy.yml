name: Build and Deploy React App

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 22 * * *'  # 每天台灣時間早上 06:00 自動定時更新
  workflow_dispatch:       # 支援在 GitHub 頁面上手動按鈕觸發更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. 安裝套件並執行抓取 Google Sheet 資料腳本
      - name: Fetch Google Sheets Data
        run: |
          pip install pandas
          python scripts/excel_to_json.py

      # 2.5 重新產生主題分類對照表（新增/更名的節點才不會在主題篩選裡永遠消失）
      - name: Regenerate theme tags
        run: python scripts/generate_theme_tags.py

      # 3. 安裝 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. 安裝前端套件並打包網站
      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
